# CIRISProxy LiteLLM Configuration
# Model routing for credit-gated LLM access
#
# This file is the source of truth for model routing. CIRISBridge's Ansible
# template (roles/proxy/templates/litellm_config.yaml.j2) is synced FROM here —
# when the two drift, the monitored set in hooks/status_handler.py stops
# matching the serving set, which is how DeepInfra ended up serving every
# request while nothing on the status board watched it.
#
# Any change to the default chain below must be mirrored in PROVIDERS in
# hooks/status_handler.py.

model_list:
  # Qwen 3.6-35B-A3B - PRIMARY model for CIRIS Agent (2026-04-27)
  # MoE: 35B total / 3B active params, 262K context
  # DeepInfra primary, OpenRouter backup, Groq llama-4-scout cross-model failover
  #
  # DRY-BY-CONSTRUCTION (2026-08-27 incident): the CIRIS Agent does NOT send its
  # own reasoning-off extras when talking through a CIRIS proxy — see
  # ciris_engine/.../llm_service/service.py _build_reasoning_off_extras:
  # `if "ciris-services" in base: return {}` (it trusts the proxy to already
  # have thinking disabled per upstream provider). That makes this file the
  # ONLY place thinking gets disabled, so a hand-copied extra_body block that
  # silently drifts (e.g. the wrong key, which OpenRouter just ignores rather
  # than erroring on) goes straight to a user as 300+ second responses with no
  # error anywhere. Fix: every alias for the same (provider, model) pair
  # shares one YAML-anchored extra_body node (&anchor / *anchor) instead of a
  # hand-copy — it is structurally impossible for an alias to drift, because
  # there is only one object.
  #
  # Qwen3 thinking disabled: DeepInfra uses chat_template_kwargs.enable_thinking=false (vLLM flag);
  # OpenRouter uses top-level extra_body.enable_thinking=false (provider API flag).
  - model_name: "qwen-3.6-35b"
    litellm_params:
      model: "deepinfra/Qwen/Qwen3.6-35B-A3B"
      api_key: "os.environ/DEEPINFRA_API_KEY"
      extra_body: &deepinfra_qwen36_extra
        chat_template_kwargs:
          enable_thinking: false

  - model_name: "deepinfra/qwen-3.6-35b"
    litellm_params:
      model: "deepinfra/Qwen/Qwen3.6-35B-A3B"
      api_key: "os.environ/DEEPINFRA_API_KEY"
      extra_body: *deepinfra_qwen36_extra

  - model_name: "openrouter/qwen-3.6-35b"
    litellm_params:
      model: "openrouter/qwen/qwen3.6-35b-a3b"
      api_key: "os.environ/OPENROUTER_API_KEY"
      extra_body:
        enable_thinking: false  # OpenRouter: top-level, not under chat_template_kwargs

  # Groq Qwen 3.6-27B - high-speed cross-model failover (2026-08-13)
  # Replaces Llama 4 Scout, which Groq retired. Same Qwen 3.6 family as the
  # primary, so tool-calling and prompt behaviour survive the failover.
  # Groq does not support Qwen3 thinking mode — no extra_body needed.
  - model_name: "groq/qwen-3.6-27b"
    litellm_params:
      model: "groq/qwen/qwen3.6-27b"
      api_key: "os.environ/GROQ_API_KEY"

  # Qwen 3.5-35B-A3B - kept for backwards compatibility
  - model_name: "qwen-3.5-35b"
    litellm_params:
      model: "openrouter/qwen/qwen3.5-35b-a3b"
      api_key: "os.environ/OPENROUTER_API_KEY"
      extra_body:
        enable_thinking: false  # OpenRouter: top-level, not under chat_template_kwargs

  - model_name: "openrouter/qwen-3.5-35b"
    litellm_params:
      model: "openrouter/qwen/qwen3.5-35b-a3b"
      api_key: "os.environ/OPENROUTER_API_KEY"
      extra_body:
        enable_thinking: false  # OpenRouter: top-level, not under chat_template_kwargs

  - model_name: "deepinfra/qwen-3.5-35b"
    litellm_params:
      model: "deepinfra/Qwen/Qwen3.5-35B-A3B"
      api_key: "os.environ/DEEPINFRA_API_KEY"
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # Llama 4 - DEPRECATED, legacy aliases only (2026-08-13)
  #
  # Verified against each provider's /models listing on 2026-08-13 with
  # scripts/verify_models.py. Removed because the provider no longer serves them:
  #   groq/meta-llama/llama-4-scout-17b-16e-instruct       (was: llama-4-scout,
  #                                                          groq/llama-4-scout, fast)
  #   groq/meta-llama/llama-4-maverick-17b-128e-instruct   (was: groq/llama-4-maverick)
  #   together_ai/meta-llama/Llama-4-Maverick-17B-128E-FP8 (was: together/llama-4-scout,
  #                                                          together/llama-4-maverick)
  #
  # OpenRouter still serves both, so the bare aliases survive there for clients
  # that have not migrated. Do not route new traffic here.
  - model_name: "llama-4-scout"
    litellm_params:
      model: "openrouter/meta-llama/llama-4-scout"
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: "openrouter/llama-4-scout"
    litellm_params:
      model: "openrouter/meta-llama/llama-4-scout"
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: "llama-4-maverick"
    litellm_params:
      model: "openrouter/meta-llama/llama-4-maverick"
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: "openrouter/llama-4-maverick"
    litellm_params:
      model: "openrouter/meta-llama/llama-4-maverick"
      api_key: "os.environ/OPENROUTER_API_KEY"

  # GPT-OSS-20B - OpenAI's open-weight model (Apache 2.0)
  # NOTE: Weak at structured outputs / tool calling - kept for reference
  - model_name: "gpt-oss-20b"
    litellm_params:
      model: "together_ai/openai/gpt-oss-20b"
      api_key: "os.environ/TOGETHER_API_KEY"
      max_tokens: 131072

  - model_name: "together/gpt-oss-20b"
    litellm_params:
      model: "together_ai/openai/gpt-oss-20b"
      api_key: "os.environ/TOGETHER_API_KEY"
      max_tokens: 131072

  - model_name: "groq/gpt-oss-20b"
    litellm_params:
      model: "groq/openai/gpt-oss-20b"
      api_key: "os.environ/GROQ_API_KEY"
      max_tokens: 131072

  - model_name: "openrouter/gpt-oss-20b"
    litellm_params:
      model: "openrouter/openai/gpt-oss-20b"
      api_key: "os.environ/OPENROUTER_API_KEY"
      max_tokens: 131072

  # Groq Models (fast, cost-effective)
  - model_name: "groq/llama-3.3-70b"
    litellm_params:
      model: "groq/llama-3.3-70b-versatile"
      api_key: "os.environ/GROQ_API_KEY"

  - model_name: "groq/llama-3.1-8b"
    litellm_params:
      model: "groq/llama-3.1-8b-instant"
      api_key: "os.environ/GROQ_API_KEY"

  # Together AI Models
  - model_name: "together/llama-3.1-70b"
    litellm_params:
      model: "together_ai/meta-llama/Meta-Llama-3.1-70B-Instruct-Turbo"
      api_key: "os.environ/TOGETHER_API_KEY"

  - model_name: "together/llama-3.1-8b"
    litellm_params:
      model: "together_ai/meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo"
      api_key: "os.environ/TOGETHER_API_KEY"

  - model_name: "together/qwen-2.5-72b"
    litellm_params:
      model: "together_ai/Qwen/Qwen2.5-72B-Instruct-Turbo"
      api_key: "os.environ/TOGETHER_API_KEY"

  # OpenAI (optional fallback)
  - model_name: "openai/gpt-4o-mini"
    litellm_params:
      model: "gpt-4o-mini"
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: "openai/gpt-4o"
    litellm_params:
      model: "gpt-4o"
      api_key: "os.environ/OPENAI_API_KEY"

  # Aliases for simpler client usage
  # Default model for CIRIS Agent - Qwen 3.6-35B-A3B via DeepInfra (2026-04-27)
  # extra_body is the *anchor* alias, not a hand-copy — see DRY-BY-CONSTRUCTION above.
  - model_name: "default"
    litellm_params:
      model: "deepinfra/Qwen/Qwen3.6-35B-A3B"
      api_key: "os.environ/DEEPINFRA_API_KEY"
      extra_body: *deepinfra_qwen36_extra

  # Fast alias - Groq Qwen 3.6-27B (high-speed cross-model failover).
  # No extra_body — Groq's qwen3.6-27b does not support/need a thinking toggle;
  # matches the plain groq/qwen-3.6-27b entry above.
  - model_name: "fast"
    litellm_params:
      model: "groq/qwen/qwen3.6-27b"
      api_key: "os.environ/GROQ_API_KEY"

litellm_settings:
  # Custom callback for CIRISBilling integration
  # Format: "filename.instance_name" where the file is in the working directory
  callbacks:
    - billing_callback.billing_callback_instance
  success_callback:
    - billing_callback.billing_callback_instance
  failure_callback:
    - billing_callback.billing_callback_instance

  # Drop unsupported parameters instead of erroring
  drop_params: true

  # Request timeout (seconds)
  request_timeout: 120

  # Set verbose for debugging (disable in production)
  set_verbose: false

  # Disable telemetry
  telemetry: false

router_settings:
  # Routing strategy for model groups with multiple deployments
  routing_strategy: "simple-shuffle"

  # Retry settings
  num_retries: 2
  retry_after: 1

  # Error-specific retry policies
  # On retry, LiteLLM picks a different deployment from the pool
  retry_policy:
    TimeoutErrorRetries: 1
    RateLimitErrorRetries: 2
    InternalServerErrorRetries: 1

  # Cooldown triggers - provider excluded after N failures per minute
  allowed_fails_policy:
    TimeoutErrorAllowedFails: 3
    RateLimitErrorAllowedFails: 5
    InternalServerErrorAllowedFails: 3

  # Seconds to exclude a failing provider from routing
  cooldown_time: 60

  # Fallback chain
  # Primary: Qwen 3.6 - DeepInfra 35B-A3B → OpenRouter 35B-A3B → Groq 27B
  # Every entry below must name a model that exists upstream; verify with
  # scripts/verify_models.py before merging a change here.
  fallbacks:
    - "default": ["openrouter/qwen-3.6-35b", "groq/qwen-3.6-27b"]
    - "qwen-3.6-35b": ["openrouter/qwen-3.6-35b", "groq/qwen-3.6-27b"]
    - "deepinfra/qwen-3.6-35b": ["openrouter/qwen-3.6-35b", "groq/qwen-3.6-27b"]
    - "openrouter/qwen-3.6-35b": ["deepinfra/qwen-3.6-35b", "groq/qwen-3.6-27b"]
    - "groq/qwen-3.6-27b": ["deepinfra/qwen-3.6-35b", "openrouter/qwen-3.6-35b"]
    # Fast alias - Groq first, then the full-size Qwen 3.6 deployments
    - "fast": ["openrouter/qwen-3.6-35b", "deepinfra/qwen-3.6-35b"]
    # Legacy Llama 4 aliases (deprecated) - cross-model failover to Qwen 3.6
    - "llama-4-scout": ["openrouter/qwen-3.6-35b"]
    - "openrouter/llama-4-scout": ["openrouter/qwen-3.6-35b"]
    - "llama-4-maverick": ["openrouter/qwen-3.6-35b"]
    - "openrouter/llama-4-maverick": ["openrouter/qwen-3.6-35b"]
    - "groq/llama-3.3-70b": ["together/llama-3.1-70b", "openai/gpt-4o-mini"]

general_settings:
  # Master key for admin operations (not for client auth)
  master_key: "os.environ/LITELLM_MASTER_KEY"

  # Custom auth function - validates Google ID tokens
  # See: https://docs.litellm.ai/docs/proxy/custom_auth
  custom_auth: "custom_auth.user_api_key_auth"

  # Disable the built-in database (we use CIRISBilling for billing)
  database_url: null

  # Disable spend logs for ZDR compliance
  disable_spend_logs: true

  # Allow all origins for mobile clients
  allowed_ips: null

  # Custom endpoints (/v1/status, /v1/search) are added via server.py wrapper
  # See server.py for implementation - these routes are added directly to FastAPI
