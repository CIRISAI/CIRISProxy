name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish mid-push

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cirisai/cirisproxy

jobs:
  # The publish gate is the full CI suite, called rather than copied. The
  # inline `pytest tests/` job that used to live here ran neither ruff, the
  # coverage gate, the config audit, nor the image smoke — so main could
  # publish an image that CI on the PR would have rejected.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets: inherit

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

# Deployment to production runs out-of-band via CIRISBridge Ansible:
#   cd ~/CIRISBridge/ansible
#   ansible-playbook -i inventory/production.yml playbooks/site.yml --tags proxy
